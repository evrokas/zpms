routes:
    userprofile:
        title: 
          en: 'User profile'
          gr: 'Προφιλ χρήστη'
        name: userprofile
        url: /profile
        module: userprofile
        # handler: module
        method: get
    userprofile_post:
        title:
          en: 'User profile'
          gr: 'Προφιλ χρήστη'
        name: userprofile_post
        url: /profile
        module: userprofile
        # handler: module
        method: post          

libraries:
  userprofile-library:
    css:
      - userprofile:
        src: '@app/css/userprofile.css'
  # Notes box on /profile: wires the Quill editor (quill module) to
  # loader.js's autosave. Attached after quill-library in user_profile.zetem.
  profile-notes-library:
    css:
      - profile_notes:
        src: '@app/css/profile-notes.css'
    foot_script:
      - profile_notes:
        type: 'text/javascript'
        src: '@app/js/profile-notes.js'
