; Raises PHP's own upload_max_filesize/post_max_size so a large-but-legal
; appointment attachment (see APPOINTMENT_FILE_MAX_BYTES in
; web/appointment_files.php, 15MB) can actually reach that check instead of
; being silently truncated at the PHP layer first. Debian/Ubuntu's stock
; php.ini defaults (upload_max_filesize=2M, post_max_size=8M) are well
; under that -- a pasted screenshot in particular routinely exceeds 2M,
; where a manually-picked, often already-compressed photo file more often
; doesn't, which is why this specifically showed up as "pasting an image
; doesn't work" rather than affecting every upload path equally.
;
; post_max_size needs a little headroom above upload_max_filesize for the
; rest of the multipart body (form fields, boundaries, the CSRF token) --
; 1MB of slack is generous for this form's few small text fields.
;
; .user.ini is picked up per-directory by PHP's CGI/FastCGI SAPIs
; (php-fpm, php-cgi) -- the deployment target Debian/Ubuntu's PHP 8
; packages ship by default, since they no longer package an Apache mod_php
; module at all. It is NOT read under classic Apache mod_php, which instead
; needs web/.htaccess's own <IfModule mod_php.c> block (added alongside
; this file) -- both are included so this works regardless of which SAPI a
; given deployment actually runs, without needing to know which in advance.
; Takes effect within user_ini.cache_ttl (php.ini default: 300s) of being
; deployed, not instantly.
upload_max_filesize = 16M
post_max_size = 17M
