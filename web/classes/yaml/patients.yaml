---
table:
  name: patients
  class: patientsClass

  fields:
  - name: guid
    type: '@guid'

  - name: cdate
    type: '@cdate'

  - name: cuser
    type: '@cuser'

  - name: pname
    type: varchar(64)

  - name: pdob
    type: datetime

  # 'M' (male), 'F' (female) or NULL (not set). A plain nullable column, no
  # default: "not set" is a real answer, so it is never filled in for the
  # user. patient_edit_post()/patient_new_post() (web/index.php) accept only
  # these values and store anything else as NULL.
  - name: pgender
    type: char(1)
    default: null

  - name: pamka
    type: char(11)

  - name: ptel
    type: varchar(32)

  - name: paddr
    type: varchar(256)

  - name: pemail
    type: varchar(128)

  - name: firstapp
    type: datetime

  - name: pnote
    type: text

  - name: deleted
    type: datetime
    default: null
...
