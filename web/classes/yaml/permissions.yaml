---
table:
  name: permissions
  class: permissionsClass

  fields:
  - name: guid
    type: '@guid'

  - name: cdate
    type: '@cdate'

  - name: cuser
    type: '@cuser'

  - name: name
    type: varchar(64)
    required: true

  - name: label
    type: varchar(255)
    required: true

...

# Registry of every fine-grained permission string the app actually checks
# via zpms_require_permission()/zpms_user_has_permission() (web/rbac.php) --
# e.g. 'patients-view-list', 'appointment-edit'. A role is granted a
# permission via a row in role_permissions, not by editing code/YAML, so
# this table is what makes that assignable without a deploy. See
# bin/migrate_roles.php for the seed list (kept in sync with every
# zpms_require_permission() call site by hand -- there's no reflection-based
# discovery, same as every other config surface in this app).
#
# - guid    row guid
# - cdate   creation date
# - cuser   creating user (system/migration script for the seeded rows)
# - name    the permission slug exactly as passed to zpms_require_permission()
# - label   human-readable description, for a future admin UI
