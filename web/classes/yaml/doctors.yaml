---
table:
  name: doctors
  class: doctorsClass

  fields:
  - name: guid
    type: '@guid'

  - name: cdate
    type: '@cdate'

  - name: cuser
    type: '@cuser'

  - name: doctor_name
    type: varchar(64)

  - name: doctor_specialty
    type: varchar(64)

  - name: deleted
    type: datetime
    default: null

form:
  name: doctors
  method: "post"
  action: "#"
  inputs:
    - name: doctor_name
      label: "Doctor name"
      type: text

    - name: doctor_specialty
      label: "Doctor specialty"
      type: text

# Named results-table views (core/maker/functions.php's
# generateHTMLFormArray() / core/lib/WebForms.php's renderFormResults() in
# the zeusfw framework) -- a document-root key (promoted here from an
# earlier form: -> table: location, and renamed to table_view to avoid any
# confusion with this same file's own, unrelated document-root `table:`
# key above, which describes the DB schema). Entirely optional -- a form
# with no `table_view:` block just keeps showing every input, as before.
# `default` is the view used by any caller that doesn't request one
# explicitly (e.g. the /webform/viewform/doctors route); table_short is
# what the Settings page's Doctors listing actually uses (web/index.php's
# settings()), passed explicitly.
table_view:
  default: table_extended
  table_short:
    - name: doctor_name
  table_extended:
    - name: doctor_name
    - name: doctor_specialty
      label: "Specialty"

  # Per-row action buttons (core/maker/functions.php's
  # zeusfw_normalize_table_row_buttons() / core/lib/FormElement.php's
  # generateHTMLTableRowButton() in the zeusfw framework), applied once
  # per table_view -- the same row actions make sense regardless of
  # which columns (table_short vs table_extended) happen to be showing.
  # `edit`/`delete` get a default icon/tooltip (bx-edit/"Edit",
  # bx-trash/"Delete"); `custom` needs both spelled out. Deliberately no
  # `handler:` on any of these yet -- this is the row-button *mechanism*
  # only, not real edit/delete/history wiring; each renders as a real,
  # correctly-styled but disabled button until a handler is added.
  actions_label: "Actions"
  buttons:
    - type: edit
    - type: delete
    - type: custom
      icon: "bx bx-history"
      tooltip: "View history"

# Named create-form views -- a document-root key, mirroring table_view
# above but for the form itself rather than its results table. Buttons
# now live here (per view) rather than under form:, so every webform must
# define at least a default view carrying buttons: -- a form with none
# renders with no Submit/Reset/Cancel at all. Only one view is defined
# here (both fields, no grouping -- deliberately not offering a
# field-hiding "compact" view the way table_view does: hiding
# doctor_specialty from a *create* form would be real lost functionality,
# not a harmless display choice).
form_view:
  default: view_full
  view_full:
    buttons:
      - type: "submit"
        label: "Submit"

      - type: "reset"
        label: "Reset"

      - type: "button"
        label: "Cancel"
        action: "window.location.href='index.php';"

    fields:
      - name: doctor_name
      - name: doctor_specialty
...
