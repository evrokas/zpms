---
table:
  name: appointments
  class: appointmentsClass
  fields:
  - name: guid
    type: '@guid'
  - name: cdate
    type: '@cdate'
  - name: cuser
    type: '@cuser'
  - name: pguid
    type: '@guid'
  - name: adate
    type: datetime
    default: current_timestamp
  - name: aplace
    type: text
  - name: anote
    type: text
  - name: atype
    type: varchar(32)
    # No SQL-level default -- maker.php's field-definition generator
    # (core/maker/functions.php) addslashes()'s a string `default:` value
    # with no surrounding quotes of its own, so there's no way to express
    # a valid quoted string literal here. Not needed anyway: every insert
    # path (patient_appointment_new()/patient_appointment_new_post() in
    # web/index.php) sets 'atype' explicitly, and every read site treats
    # anything other than the literal string 'operation' as the plain
    # 'appointment' type, so a NULL column value already behaves exactly
    # like a default of 'appointment' would.
    #
    # Immutable after creation -- decided once by which "Add ..." button
    # was clicked on the patient page (Νέο Ραντεβού vs Νέο Χειρουργείο,
    # see edit_patient.zetem), never a user-editable dropdown.
    # appointment_edit_post() (the existing-appointment save handler) never
    # touches this column at all, by design.
  - name: deleted
    type: datetime
    default: null
...

# - guid appointment guid
# - cdate appointment creation date
# - cuser appointment creation user
# - pguid patient guid
# - adata appointment date/time
# - aplace appointment place
# - anote appointment notes
# - atype appointment type -- 'appointment' (plain, default) or
#   'operation' (displayed as "Χειρουργείο"). Set once at creation, never
#   editable afterward.
#
# aoperationnotes (a separate free-text field for operation details) was
# removed 2026-08-27 -- a single shared anote field turned out to be all
# that was needed, regardless of atype. Any pre-existing content was
# migrated into anote by bin/migrate_operation_notes.php before this
# column was dropped from the schema; see that script for the exact
# migration and the DROP COLUMN statement it prints at the end. That
# script must be run against a production database BEFORE removing this
# comment/regenerating with this yaml -- otherwise operation-details text
# already on file is silently orphaned in a DB column the app no longer
# reads.
