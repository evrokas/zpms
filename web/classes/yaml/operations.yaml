---
table:
  name: operations
  class: operationsClass

  fields:
    - name: guid
      type: '@guid'

    - name: cdate
      type: '@cdate'

    - name: cuser
      type: '@cuser'

    - name: opdate
      type: datetime
      default: current_timestamp

    - name: pguid
      type: '@guid'

    - name: pname
      type: varchar(64)
      required: true

    - name: pdob
      type: datetime

    - name: opdiagnosis
      type: text

    - name: opprocedure
      type: text

    - name: clinic
      type: text

    - name: category
      type: text

    - name: surgeon1
      type: varchar(64)

    - name: surgeon2
      type: varchar(64)

    - name: anesthesiology
      type: varchar(64)



form:
  name: operations
  method: "post"
  action: "#"
  inputs:
    - name: opdate
      label: "Operation date"
      type: date

    - name: pguid
      label: "Patient GUID"
      type: text

    - name: pname
      label: "Name"
      type: text
      required: true

    - name: pdob
      label: "Date of birth"
      type: datetime

    - name: opdiagnosis
      label: "diagnosis"
      type: text

    - name: opprocedure
      label: "Procedure"
      type: text

    - name: clinic
      label: "Clinic"
      type: select
      options:
        iatrikoperisteriou: "Iatriko Peristeriou"
        metropolitanhostpial: "Metropolitan Hospital"
        bioclinic: "Bioclinic Athens"

    - name: category
      label: "Procedure category"
      type: text

    - name: surgeon1
      label: "Main surgeon"
      type: text

    - name: surgeon2
      label: "Assistant surgeon"
      type: text

    - name: anesthesiology
      label: "Anesthesiologist"
      type: text

# Named create-form views -- a document-root key, mirroring table_view
# (which this form doesn't use). Buttons now live here (per view) rather
# than under form:, so every webform must define at least a default view
# carrying buttons: -- a form with none renders with no
# Submit/Reset/Cancel at all.
#
# operations has by far the most fields of any webform in this app, so
# it's the concrete demonstration of real, multi-level grouping and of a
# form offering more than one view: view_full groups fields into Patient
# Info / Procedure (with a nested Location sub-group -- 2 levels deep) /
# Staff, while view_quick is a flat, ungrouped short list for a fast
# entry. Note: nothing in zpms currently renders this form on a live page
# -- both views exist and are exercised at the yaml/rendering level only.
form_view:
  default: view_full

  view_full:
    buttons:
      - type: "submit"
        label: "Submit"

      - type: "reset"
        label: "Reset"

      - type: "button"
        label: "Cancel"
        action: "window.location.href='index.php';"

    groups:
      - label: "Patient Info"
        fields:
          - name: pname
          - name: pguid
          - name: pdob

      - label: "Procedure"
        fields:
          - name: opdate
          - name: opdiagnosis
          - name: opprocedure
          - name: category
        groups:
          - label: "Location"
            fields:
              - name: clinic

      - label: "Staff"
        fields:
          - name: surgeon1
          - name: surgeon2
          - name: anesthesiology

  view_quick:
    buttons:
      - type: "submit"
        label: "Submit"

      - type: "reset"
        label: "Reset"

      - type: "button"
        label: "Cancel"
        action: "window.location.href='index.php';"

    fields:
      - name: pname
      - name: opdate
      - name: opprocedure
...
