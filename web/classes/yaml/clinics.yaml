table:
  name: clinics
  class: clinicsClass

  fields:
    - name: guid
      type: "@guid"

    - name: cdate
      type: "@cdate"

    - name: cuser
      type: "@cuser"

    - name: clinic_name
      type: varchar(128)

    - name: deleted
      type: "@delete"

form:
  name: clinics
  method: "post"
  action: "#"

  inputs:
    - name: clinic_name
      label: "Clinic name"
      type: text

    # Never shown -- carries an existing row's guid back on submit so
    # formsClass::storeFormResults() (zeusfw) updates that row instead of
    # inserting a new one. Empty/absent on the plain "Add New Clinic"
    # form (Settings page), populated only by clinics_row_edit()'s own
    # renderForm(..., $default_values) call (web/index.php).
    - name: row_guid
      type: hidden

# Named results-table views (core/maker/functions.php's
# generateHTMLFormArray() / core/lib/WebForms.php's renderFormResults()
# in the zeusfw framework) -- a document-root key, mirroring doctors.yaml.
# Only one view (this form has just the one field to show); its own
# `buttons:` are what give the Clinics table its Edit/Delete row actions.
table_view:
  default: table_default
  table_default:
    - name: clinic_name

  actions_label: "Actions"
  buttons:
    - type: edit
      handler: clinics_edit_url
    - type: delete
      handler: clinics_delete_url

# Named create-form views (core/maker/functions.php's
# generateHTMLFormArray() / core/lib/FormElement.php's generateHTMLForm()
# in the zeusfw framework) -- a document-root key, sibling of table:/form:
# above. Buttons now live here (per view) rather than under form:, so
# every webform must define at least a default view carrying buttons: --
# a form with none renders with no Submit/Reset/Cancel at all.
form_view:
  default: view_full
  view_full:
    buttons:
      - type: "submit"
        label: "Submit"

      - type: "reset"
        label: "Reset"

      - type: "button"
        label: "Cancel"
        action: "window.location.href='index.php';"

    fields:
      - name: clinic_name
      - name: row_guid
