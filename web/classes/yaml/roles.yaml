---
table:
  name: roles
  class: rolesClass

  fields:
  - name: guid
    type: '@guid'

  - name: cdate
    type: '@cdate'

  - name: cuser
    type: '@cuser'

  - name: name
    type: varchar(64)
    required: true

  - name: label
    type: varchar(255)
    required: true

  - name: is_superuser
    type: boolean
    default: false

...

# A named, assignable bundle of permissions -- what users.roles (a single
# CHAR(36) column holding a raw space-separated string, e.g. "power-user",
# validated only against a hardcoded YAML array) used to be, before the
# user_roles/role_permissions tables replaced it. See web/rbac.php's own
# docblock for the full story of why, and bin/migrate_roles.php for
# transferring an existing install's old users.roles values into this
# schema.
#
# - guid           row guid
# - cdate          creation date
# - cuser          creating user (system/migration script for the seeded rows)
# - name           short slug (e.g. 'power-user'), matched 1:1 against the
#                  old users.roles tokens by bin/migrate_roles.php
# - label          human-readable name, for a future admin UI
# - is_superuser   bypasses the permission check entirely (see
#                  zpms_user_has_permission() in web/rbac.php) -- the
#                  correctly-scoped replacement for the old
#                  'administrator: all' config value, which actually threw
#                  a fatal TypeError the moment anyone with that role hit a
#                  permission check (in_array() against the literal string
#                  "all" instead of an array). Grant this to at most a
#                  small number of trusted accounts.
