# Module site configuration
#
# modfconf:
#   module_name:
#     hide: (hide module from these routes)
#     display: (display module in these routes)
#       route_name:
#         arguments: (arguments to pass by default)
#           - arg1: value1
#         access: [access_roles, to allow for route]
modconf:
  message:
    display:
      userprofile:
          arguments:
            type: "Announcements"
          access: authenticated
      

modules:
  path:
    - "/web/core/modules/"
    - "/web/modules/"
  modules:
    - admin
    - mainnavigation
    - notifications
    - header
    - breadcrumbs
    - userblock
    - userprofile
    - htmltext
    - githash
    - copyright
    - content
    - location
    - datepicker
    - language_selector
    - message
    - backup
